name: singhelper
description: A singing practice helper app for iPhone with AI-powered features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Audio
  just_audio: ^0.9.36
  record: ^5.0.4
  audio_session: ^0.1.18
  
  # File Handling
  file_picker: ^6.1.1
  
  # HTTP & API
  dio: ^5.4.0
  
  # Charts
  fl_chart: ^0.65.0
  
  # Routing
  go_router: ^12.1.3
  
  # Utilities
  uuid: ^4.2.1
  permission_handler: ^11.1.0
  shared_preferences: ^2.2.2
  path: ^1.8.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
